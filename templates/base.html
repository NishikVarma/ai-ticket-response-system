<!doctype html>
<html><head><meta charset="utf-8"><title>Ticket Response System</title>
<style>
body{font-family:system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#222}
nav a{margin-right:1rem} table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
label{display:block;margin-top:.8rem;font-weight:600} input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:.4rem;box-sizing:border-box}
.err{color:#b00020;font-size:.9rem} .warn{background:#fff4e5;border:1px solid #f0b36b;padding:.6rem;margin:.8rem 0}
.box{background:#f4f6f8;padding:.7rem;margin:.5rem 0;white-space:pre-wrap} button{margin-top:1rem;padding:.4rem .9rem} .inline{display:inline}
</style></head><body>
<nav><a href="/">Tickets</a><a href="/tickets/new">New ticket</a><a href="/fields">Custom fields</a></nav><hr>
{% block body %}{% endblock %}
</body></html>
